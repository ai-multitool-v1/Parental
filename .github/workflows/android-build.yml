# Build Android Debug APK — Family Safety child app
#
# • Builds on every push that touches the Android module (and manually via
#   workflow_dispatch).
# • Gradle 8.5 + JDK 17 (matched to AGP 8.2.2 / Kotlin 1.9.22).
# • google-services.json: the REAL Android client config is committed at
#   parental-control/android/app/google-services.json (public-by-design — its
#   API key ships inside every APK). This step prefers that committed file;
#   falls back to the GOOGLE_SERVICES_JSON repository secret, then to the
#   checked-in example file so CI stays green even without either.
# • APK is uploaded as a build artifact: Actions → run → Artifacts →
#   app-debug-apk (installable directly on a device).
#
# Develop By Silent Exploit Team Bd · Powered By AI MultiTool

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "parental-control/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare google-services.json
        working-directory: parental-control/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f google-services.json ]; then
            echo "google-services.json: using committed file checked into the repo"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json: using GOOGLE_SERVICES_JSON secret"
          else
            cp google-services.json.example google-services.json
            echo "WARNING: no committed file and GOOGLE_SERVICES_JSON secret not set — using placeholder example file. Build will pass but the APK will not connect to Firebase."
          fi
          python3 - <<'PYEOF'
          import json
          with open("google-services.json") as f:
              cfg = json.load(f)
          pkg = cfg["client"][0]["client_info"]["android_client_info"]["package_name"]
          print(f"google-services.json parsed OK — package: {pkg}, project: {cfg['project_info']['project_id']}")
          assert pkg == "org.setbd.parentcontrol", f"package mismatch: {pkg}"
          PYEOF

      - name: Build debug APK
        working-directory: parental-control/android
        env:
          # Trusted backend (Cloudflare Worker) base URL — set this repo
          # VARIABLE to the deployed worker URL, e.g.
          #   https://parental-control-api.<your-subdomain>.workers.dev
          # (no secret; the APK embeds only the public endpoint address)
          SECURE_API_BASE: ${{ vars.SECURE_API_BASE }}
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(ls parental-control/android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: parental-control/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
