# Build Android Debug APK — Family Safety child app
#
# • Builds on every push that touches the Android module (and manually via
#   workflow_dispatch).
# • Gradle 8.5 + JDK 17 (matched to AGP 8.2.2 / Kotlin 1.9.22).
# • google-services.json: the REAL Android client config is committed at
#   parental-control/android/app/google-services.json (public-by-design — its
#   API key ships inside every APK). This step prefers that committed file;
#   falls back to the GOOGLE_SERVICES_JSON repository secret, then to the
#   checked-in example file so CI stays green even without either.
# • APK is uploaded as a build artifact: Actions → run → Artifacts →
#   app-debug-apk (installable directly on a device).
#
# Develop By Silent Exploit Team Bd · Powered By AI MultiTool

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "parental-control/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble Debug APK + Publish to Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release + upload the APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Prepare google-services.json
        working-directory: parental-control/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f google-services.json ]; then
            echo "google-services.json: using committed file checked into the repo"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "google-services.json: using GOOGLE_SERVICES_JSON secret"
          else
            cp google-services.json.example google-services.json
            echo "WARNING: no committed file and GOOGLE_SERVICES_JSON secret not set — using placeholder example file. Build will pass but the APK will not connect to Firebase."
          fi
          python3 - <<'PYEOF'
          import json
          with open("google-services.json") as f:
              cfg = json.load(f)
          pkg = cfg["client"][0]["client_info"]["android_client_info"]["package_name"]
          print(f"google-services.json parsed OK — package: {pkg}, project: {cfg['project_info']['project_id']}")
          assert pkg == "org.setbd.parentcontrol", f"package mismatch: {pkg}"
          PYEOF

      - name: Build debug APK
        working-directory: parental-control/android
        env:
          # Trusted backend (Cloudflare Worker) base URL — set this repo
          # VARIABLE to the deployed worker URL, e.g.
          #   https://parental-control-api.<your-subdomain>.workers.dev
          # (no secret; the APK embeds only the public endpoint address)
          SECURE_API_BASE: ${{ vars.SECURE_API_BASE }}
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(ls parental-control/android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: parental-control/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── Publish the APK to the GitHub Releases tab ──────────────────────
      # Every successful build creates a release tagged child-v1.0.<run#> and
      # marked Latest. The asset keeps a STABLE name, so this URL always
      # serves the newest APK (perfect for sending to parents):
      #   https://github.com/<owner>/<repo>/releases/latest/download/ParentalControl-child-debug.apk
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ env.APK_PATH }}
          RUN_NUM: ${{ github.run_number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="child-v1.0.${RUN_NUM}"
          ASSET="ParentalControl-child-debug.apk"
          cp "$APK_PATH" "$ASSET"
          SHA=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(du -h "$ASSET" | cut -f1)
          NOTES=$(cat <<EOF
          ## Parental Control — Child App (debug APK)

          **Install (Eng):** download the APK below → open it → allow "Install unknown apps" for your browser → Install. Requires Android 8.0+.

          **ইনস্টল (বাংলা):** নিচের APK ফাইলটি ডাউনলোড করুন → খুলুন → ব্রাউজারকে "অজানা অ্যাপ ইনস্টল" অনুমতি দিন → ইনস্টল করুন।

          - File: \`$ASSET\` ($SIZE)
          - SHA-256: \`$SHA\`
          - Always-newest direct link: ${REPO_URL}/releases/latest/download/${ASSET}
          - Backend: built-in (SECURE_API_BASE baked at build time)

          After install: open the app on the child device, enter the 8-character code from the parent dashboard, done.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --latest --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" \
              --title "Child App v1.0.$RUN_NUM (debug)" \
              --notes "$NOTES" \
              --latest
          fi
          echo "Released: $REPO_URL/releases/tag/$TAG"
