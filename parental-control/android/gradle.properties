# Family Safety child app — Gradle configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by Compose, WorkManager and lifecycle APIs.
android.useAndroidX=true
# Kotlin code generation writes classes referenced from non-Kotlin modules.
android.nonTransitiveRClass=true

# Suppress the Compose + Kotlin compatibility check that blocks builds when a
# newer Kotlin patch version ships before the Compose compiler metadata.
android.suppressUnsupportedCompileSdk=34
kotlin.code.style=official
